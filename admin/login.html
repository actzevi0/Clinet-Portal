<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כניסה לאזור יועץ – EasyFinance</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
  .login-wrap { width:100%; max-width:420px; padding:20px; }
  .login-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:40px 36px; box-shadow:0 8px 32px rgba(0,0,0,.18); }
  .login-logo { text-align:center; margin-bottom:32px; }
  .login-logo img { max-height:56px; max-width:180px; object-fit:contain; }
  .login-logo .brand { font-size:1.6rem; font-weight:800; color:var(--primary); letter-spacing:-0.5px; }
  .login-logo .sub { font-size:.82rem; color:var(--text-muted); margin-top:4px; }
  .form-group { margin-bottom:18px; }
  .form-group label { display:block; font-size:.82rem; font-weight:600; margin-bottom:6px; color:var(--text-muted); }
  .form-group .input-wrap { position:relative; }
  .form-group input { width:100%; padding:11px 16px 11px 42px; border:1.5px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:.92rem; font-family:Heebo,sans-serif; box-sizing:border-box; transition:.2s; }
  .form-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(26,86,219,.15); }
  .form-group .input-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:.9rem; pointer-events:none; }
  .form-group .toggle-pw { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-dim); cursor:pointer; font-size:.88rem; background:none; border:none; padding:0; }
  .btn-login { width:100%; padding:13px; background:linear-gradient(135deg,#1a56db,#0ea5e9); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; font-family:Heebo,sans-serif; transition:.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-login:hover { opacity:.9; transform:translateY(-1px); }
  .btn-login:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .error-msg { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#ef4444; border-radius:8px; padding:10px 14px; font-size:.84rem; margin-bottom:16px; display:none; }
  .error-msg.show { display:block; }
  .forgot-link { text-align:center; margin-top:18px; font-size:.84rem; color:var(--text-muted); }
  .forgot-link a { color:var(--primary); text-decoration:none; font-weight:600; }
  .forgot-link a:hover { text-decoration:underline; }
  .divider { border:none; border-top:1px solid var(--border); margin:24px 0; }
  .demo-hint { background:rgba(16,185,129,.08); border:1px solid rgba(16,185,129,.25); border-radius:8px; padding:10px 14px; font-size:.8rem; color:var(--text-muted); text-align:center; }
  .demo-hint strong { color:#10b981; }

  /* Reset password modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:1000; display:none; }
  .modal-overlay.show { display:flex; }
  .modal-box { background:var(--bg-card); border-radius:12px; padding:32px; max-width:400px; width:90%; }
  .modal-box h3 { margin:0 0 8px; font-size:1.1rem; }
  .modal-box p { font-size:.84rem; color:var(--text-muted); margin:0 0 20px; }
  .modal-box input { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:.9rem; font-family:Heebo,sans-serif; box-sizing:border-box; margin-bottom:12px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div id="agentLogoWrap" style="display:none;margin-bottom:12px;">
        <img id="agentLogoImg" src="" alt="לוגו סוכנות">
      </div>
      <div class="brand"><i class="fas fa-chart-line" style="color:#0ea5e9;margin-left:8px;font-size:1.3rem;"></i>EasyFinance</div>
      <div class="sub">פאנל ניהול יועץ</div>
    </div>

    <div class="error-msg" id="errMsg"></div>

    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="emailInput">אימייל</label>
        <div class="input-wrap">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="emailInput" placeholder="your@email.com" required autocomplete="email" dir="ltr">
        </div>
      </div>
      <div class="form-group">
        <label for="pwInput">סיסמה</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="pwInput" placeholder="••••••••" required autocomplete="current-password" dir="ltr">
          <button type="button" class="toggle-pw" onclick="togglePw()"><i class="fas fa-eye" id="eyeIcon"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i>
        כניסה לאזור הניהול
      </button>
    </form>

    <div class="forgot-link">
      <a href="#" onclick="openReset()">שכחתי סיסמה</a>
    </div>

    <hr class="divider">
    <div class="demo-hint" id="demoHint" style="display:none;">
      <strong>מצב Demo</strong> — לא מחובר למסד נתונים<br>
      אין צורך בסיסמה, לוחצים על "כניסה"
    </div>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <h3><i class="fas fa-key" style="color:var(--primary);margin-left:8px;"></i>איפוס סיסמה</h3>
    <p>הכנס את כתובת האימייל שלך. נשלח אליך קישור לאיפוס הסיסמה.</p>
    <div class="error-msg" id="resetErr"></div>
    <input type="email" id="resetEmail" placeholder="your@email.com" dir="ltr">
    <div id="resetSuccess" style="display:none;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:10px 14px;font-size:.84rem;color:#10b981;">
      <i class="fas fa-check-circle"></i> קישור האיפוס נשלח לאימייל שלך.
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeReset()">ביטול</button>
      <button class="btn" id="resetBtn" onclick="doReset()">
        <i class="fas fa-paper-plane"></i> שלח קישור
      </button>
    </div>
  </div>
</div>

<script>
const API_BASE = '';
let IS_DEMO_MODE = false;

// ── Check if already logged in ────────────────────────────────────
(async function init() {
  const token = sessionStorage.getItem('agent_token') || localStorage.getItem('agent_token');
  if (token) {
    try {
      const r = await fetch('/auth/me', { headers: { 'X-Session-Token': token } });
      if (r.ok) {
        const me = await r.json();
        // Already logged in — redirect
        const dest = me.role === 'superadmin'
          ? '/admin/superadmin.html'
          : '/admin/index.html';
        window.location.replace(dest);
        return;
      }
    } catch(e) {}
    // Token invalid — clear
    sessionStorage.removeItem('agent_token');
    localStorage.removeItem('agent_token');
  }

  // Check if API is available
  try {
    const r = await fetch('/tables/clients?page=1&limit=1');
    const d = await r.json();
    if (d.error && d.error.includes('D1 not bound')) {
      IS_DEMO_MODE = true;
      document.getElementById('demoHint').style.display = 'block';
    }
  } catch(e) {
    IS_DEMO_MODE = true;
    document.getElementById('demoHint').style.display = 'block';
  }
})();

// ── Login ─────────────────────────────────────────────────────────
async function doLogin(e) {
  e.preventDefault();
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('errMsg');
  const email = document.getElementById('emailInput').value.trim();
  const pw    = document.getElementById('pwInput').value;

  err.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> מתחבר...';

  // Demo mode — skip auth
  if (IS_DEMO_MODE) {
    saveDemoSession(email);
    window.location.replace('/admin/index.html');
    return;
  }

  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });
    const d = await r.json();

    if (!r.ok) {
      showErr(d.error || 'שגיאה בהתחברות');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> כניסה לאזור הניהול';
      return;
    }

    // Save session
    const { token, agent } = d;
    localStorage.setItem('agent_token', token);
    localStorage.setItem('agent_info', JSON.stringify(agent));
    sessionStorage.setItem('agent_token', token);

    // Redirect based on role
    if (agent.role === 'superadmin') {
      window.location.replace('/admin/superadmin.html');
    } else {
      window.location.replace('/admin/index.html');
    }

  } catch(ex) {
    showErr('שגיאת רשת. נסה שוב.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> כניסה לאזור הניהול';
  }
}

function saveDemoSession(email) {
  const demoAgent = {
    id: 'demo-agent', name: 'סוכן לדוגמה',
    email: email || 'demo@example.com',
    role: 'agent', plan: 'pro', client_quota: 50
  };
  localStorage.setItem('agent_token', 'demo-token');
  localStorage.setItem('agent_info', JSON.stringify(demoAgent));
  sessionStorage.setItem('agent_token', 'demo-token');
}

// ── Password visibility toggle ────────────────────────────────────
function togglePw() {
  const inp  = document.getElementById('pwInput');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

// ── Forgot Password ───────────────────────────────────────────────
function openReset() {
  document.getElementById('resetModal').classList.add('show');
  document.getElementById('resetErr').classList.remove('show');
  document.getElementById('resetSuccess').style.display = 'none';
  document.getElementById('resetEmail').value = document.getElementById('emailInput').value;
}
function closeReset() {
  document.getElementById('resetModal').classList.remove('show');
}

async function doReset() {
  const btn   = document.getElementById('resetBtn');
  const email = document.getElementById('resetEmail').value.trim();
  const err   = document.getElementById('resetErr');

  if (!email) { showResetErr('הכנס אימייל'); return; }
  err.classList.remove('show');
  btn.disabled = true;

  if (IS_DEMO_MODE) {
    document.getElementById('resetSuccess').style.display = 'block';
    document.getElementById('resetSuccess').textContent = '[Demo] שחזור סיסמה אינו זמין במצב Demo';
    btn.disabled = false;
    return;
  }

  try {
    await fetch('/auth/request-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    document.getElementById('resetSuccess').style.display = 'block';
  } catch(e) {
    showResetErr('שגיאת רשת');
  }
  btn.disabled = false;
}

function showErr(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.classList.add('show');
}
function showResetErr(msg) {
  const el = document.getElementById('resetErr');
  el.textContent = msg;
  el.classList.add('show');
}

// Theme
const t = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', t);
</script>
</body>
</html>
